<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLAJ.ME — Crnogorski Fudbal</title>
<style>
:root{
  --red:#CC0000;--gold:#F5A623;
  --dark:#0A0A0A;--dark2:#111;--dark3:#181818;
  --border:#252525;--text:#F0EDE8;--muted:#888;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:Arial,sans-serif;}
.ticker{height:34px;background:var(--red);display:flex;overflow:hidden;}
.ticker-lbl{background:#000;color:var(--gold);padding:0 12px;display:flex;align-items:center;}
.ticker-scroll{flex:1;overflow:hidden;}
.ticker-inner{display:flex;animation:ticker 40s linear infinite;white-space:nowrap;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.t-item{padding:0 18px;font-size:12px;color:#fff;display:inline-flex;align-items:center;gap:7px;}

nav{background:var(--dark2);border-bottom:1px solid var(--border);position:sticky;top:0;}
.nav-wrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:52px;padding:0 14px;}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;margin-right:auto;}
.logo-box{width:34px;height:34px;background:#000;border-radius:5px;display:flex;align-items:center;justify-content:center;}
.logo-box img{width:30px;}
.logo-txt{font-weight:bold;font-size:18px;}
.logo-txt span{color:var(--red);}
.nav-links a{padding:0 12px;color:var(--muted);text-decoration:none;font-size:12px;}
.nav-links a.active{color:var(--text);}
.nav-right{display:flex;gap:8px;margin-left:auto;}
.btn-theme{background:var(--dark3);border:1px solid var(--border);padding:6px 10px;border-radius:4px;cursor:pointer;}

/* HERO VELIKA VIJEST */
.hero-large{margin:14px 0;position:relative;}
.hero-wrap{position:relative;width:100%;aspect-ratio:21/9;max-height:500px;border-radius:8px;overflow:hidden;}
.hero-img{position:absolute;inset:0;}
.hero-img img{width:100%;height:100%;object-fit:cover;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent 50%);}
.hero-badge{position:absolute;top:16px;left:16px;background:var(--red);padding:4px 12px;border-radius:3px;font-size:10px;}
.hero-body{position:absolute;bottom:0;left:0;right:0;padding:20px;}
.hero-cat{color:var(--gold);font-size:11px;margin-bottom:6px;}
.hero-title{color:#fff;font-size:28px;font-weight:bold;margin-bottom:12px;}
@media(max-width:600px){.hero-title{font-size:18px;}}
.hero-btn{background:var(--gold);color:#000;border:none;padding:8px 20px;border-radius:4px;font-weight:bold;cursor:pointer;}

/* TRANSFERI (VELIKE FOTO) */
.tr-widget{background:var(--dark2);border:1px solid var(--border);border-radius:8px;margin:14px 0;}
.tr-header{padding:14px 20px;background:var(--dark3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
.tr-title{color:var(--gold);font-weight:bold;}
.tr-more{font-size:11px;color:var(--muted);cursor:pointer;}
.tr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--border);}
.tr-item{background:var(--dark2);padding:15px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;}
.tr-item:hover{background:var(--dark3);}
.tr-av{width:58px;height:58px;border-radius:50%;background:var(--dark4);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;overflow:hidden;}
.tr-av img{width:100%;height:100%;object-fit:cover;}
.tr-info{flex:1;}
.tr-name{font-size:15px;font-weight:bold;}
.tr-detail{font-size:11px;color:var(--muted);}
.tr-badge{font-size:10px;padding:4px 10px;border-radius:4px;white-space:nowrap;}
.tr-badge.free{background:rgba(0,200,81,.15);color:#00C851;border:1px solid rgba(0,200,81,.3);}
.tr-badge.contract{background:rgba(26,127,255,.15);color:#1a7fff;border:1px solid rgba(26,127,255,.3);}
.tr-badge.rumour{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.3);}

/* VIJESTI GRID */
.wrap{max-width:1200px;margin:0 auto;padding:0 14px;}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:20px 0;}
.news-card{background:var(--dark3);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;height:220px;position:relative;}
.news-card img{width:100%;height:100%;object-fit:cover;}
.news-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);padding:15px;}
.news-cat{color:var(--gold);font-size:9px;}
.news-title{color:#fff;font-size:14px;font-weight:bold;margin-top:4px;}
.news-date{color:#aaa;font-size:9px;margin-top:4px;}

.scores-bar{background:var(--dark2);border:1px solid var(--border);border-radius:8px;margin:14px 0;}
.scores-tabs{display:flex;padding:10px;gap:10px;}
.stab{padding:5px 12px;border-radius:4px;cursor:pointer;font-size:11px;}
.stab.on{background:var(--red);color:#fff;}
.matches-scroll{display:flex;gap:10px;overflow-x:auto;padding:10px;}
.mc{flex:0 0 150px;background:var(--dark3);border:1px solid var(--border);border-radius:6px;padding:10px;}
.mc-status{font-size:9px;color:var(--muted);}
.mc-team{display:flex;justify-content:space-between;margin:5px 0;}
.mc-name{font-size:12px;}
.mc-sc{font-weight:bold;color:var(--gold);}

.sidebar{width:300px;flex-shrink:0;}
@media(min-width:900px){.main{display:flex;gap:24px;}.content{flex:1;}}

.sw{background:var(--dark2);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;}
.sw-head{padding:12px;background:var(--dark3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
.st-table{width:100%;font-size:11px;}
.st-table td{padding:5px;}
.pts{color:var(--gold);font-weight:bold;}
.pm{width:20px;height:20px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;}
.p1{background:var(--gold);color:#000;}
.p2{background:#1a7fff;color:#fff;}
.pr{background:var(--red);color:#fff;}
.scorer{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.scr-rank{width:25px;font-weight:bold;}
.scr-rank.top{color:var(--gold);}
.scr-goals{font-size:18px;font-weight:bold;color:var(--gold);}

footer{background:var(--dark2);border-top:1px solid var(--border);padding:20px;text-align:center;font-size:11px;margin-top:30px;}
</style>
</head>
<body>

<div class="ticker">
  <div class="ticker-lbl"><div>⚡</div>BREAKING</div>
  <div class="ticker-scroll"><div class="ticker-inner" id="tickerInner"></div></div>
</div>

<nav>
  <div class="nav-wrap">
    <div class="logo" onclick="go('home')">
      <div class="logo-box"><img src="https://www.rolaj-me.com/wp-content/uploads/2025/07/cropped-Untitled_design__19_-removebg-preview.png" alt=""></div>
      <div class="logo-txt">ROLAJ<span>ME</span></div>
    </div>
    <div class="nav-links">
      <a onclick="go('home')" id="nl-home" class="active">Home</a>
      <a onclick="go('vijesti')" id="nl-vijesti">Vijesti</a>
      <a onclick="go('transferi')" id="nl-transferi" style="color:var(--gold)">Transferi</a>
    </div>
    <div class="nav-right">
      <button class="btn-theme" onclick="toggleTheme()">🌙</button>
    </div>
  </div>
</nav>

<div class="page active" id="page-home">
  <div class="wrap">
    <!-- HERO - VELIKA VIJEST NA VRHU -->
    <div class="hero-large" id="heroLarge"></div>

    <!-- REZULTATI -->
    <div class="scores-bar">
      <div class="scores-tabs">
        <div class="stab on" onclick="switchLeague(1)">⚽ 1.CFL</div>
        <div class="stab" onclick="switchLeague(2)">⚽ 2.CFL</div>
      </div>
      <div class="matches-scroll" id="matchesContainer"></div>
    </div>

    <!-- TRANSFERI SA VELIKIM FOTOGRAFIJAMA -->
    <div class="tr-widget">
      <div class="tr-header">
        <div class="tr-title">🔄 TRANSFERI</div>
        <div class="tr-more" onclick="go('transferi')">SVI TRANSFERI →</div>
      </div>
      <div class="tr-grid" id="trWidgetHome"></div>
    </div>

    <!-- NAJNOVIJE VIJESTI -->
    <div class="main">
      <div class="content">
        <div class="news-grid" id="newsGrid"></div>
      </div>
      <div class="sidebar">
        <div class="sw"><div class="sw-head"><span>🏆 Tabela 1.CFL</span></div><div class="sw-body"><table class="st-table" id="tableBody"></table></div></div>
        <div class="sw"><div class="sw-head"><span>🥅 Strijelci 1.CFL</span></div><div class="sw-body" id="scorersBody"></div></div>
        <div class="sw"><div class="sw-head"><span>📊 36. Kolo</span></div><div class="sw-body"><div id="koloBody"></div></div></div>
      </div>
    </div>
  </div>
</div>

<footer><p>© 2026 ROLAJ.ME — Crnogorski fudbal</p></footer>

<script>
// STATIC PODACI ZA BRZI RAD
const matchesData = {
  1: [{t1:"Bokelj",s1:1,t2:"Dečić",s2:0},{t1:"Arsenal",s1:1,t2:"OFK Mladost",s2:4},{t1:"Sutjeska",s1:1,t2:"Jedinstvo",s2:3},{t1:"Jezero",s1:0,t2:"Mornar",s2:2},{t1:"Petrovac",s1:1,t2:"Budućnost",s2:1}],
  2: [{t1:"Kom",s1:0,t2:"Otrant",s2:2},{t1:"Grbalj",s1:2,t2:"Internacional",s2:0},{t1:"Iskra",s1:3,t2:"Rudar",s2:1},{t1:"Podgorica",s1:3,t2:"Berane",s2:1},{t1:"Igalo",s1:2,t2:"Lovćen",s2:4}]
};
const tablesData = {1:[{rank:1,name:"Sutjeska",ut:36,pts:73,z:"cl"},{rank:2,name:"Mornar",ut:36,pts:69,z:"eu"},{rank:3,name:"Petrovac",ut:36,pts:51,z:"eu"},{rank:4,name:"Dečić",ut:36,pts:51,z:"n"},{rank:5,name:"Budućnost",ut:36,pts:47,z:"n"}]};
const scorersData = {1:[{rank:1,name:"Balša Sekulić",club:"Mornar",g:15,top:true},{rank:2,name:"Đ. Maksimović",club:"Jezero",g:13,top:false},{rank:3,name:"S. Denković",club:"Mornar",g:10,top:false}]};

let wpPosts = [];
let curLg = 1;

// API POZIV ZA VIJESTI
async function loadPosts() {
  try {
    const res = await fetch('https://www.rolaj-me.com/wp-json/wp/v2/posts?per_page=8&_embed');
    if(res.ok) {
      const posts = await res.json();
      wpPosts = posts.map(p => ({
        title: p.title.rendered.replace(/<[^>]*>/g, ''),
        date: new Date(p.date).toLocaleDateString('bs'),
        img: p._embedded?.['wp:featuredmedia']?.[0]?.source_url || 'https://via.placeholder.com/400x250',
        link: p.link,
        cat: 'VIJEST'
      }));
    } else throw new Error();
  } catch(e) {
    wpPosts = [
      {title:"SUTJESKA ŠAMPION CRNE GORE!",date:"24.05.2026",img:"https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=800",link:"#",cat:"1.CFL"},
      {title:"Adrijan Rudović napustio Prishtinu — traži novi klub",date:"25.05.2026",img:"https://www.rolaj-me.com/wp-content/uploads/2026/05/imageedit_1_7422185843.jpg",link:"#",cat:"TRANSFERI"},
      {title:"Arsenal i Sutjeska podijelili bodove",date:"10.05.2026",img:"https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800",link:"#",cat:"1.CFL"}
    ];
  }
  renderHero();
  renderNews();
  renderTicker();
}

function renderHero() {
  const hero = wpPosts[0] || {title:"SUTJESKA ŠAMPION!",img:"https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=1200",cat:"1.CFL",link:"#"};
  document.getElementById("heroLarge").innerHTML = `
    <div class="hero-wrap">
      <div class="hero-img"><img src="${hero.img}" alt=""></div>
      <div class="hero-overlay"></div>
      <div class="hero-badge">🔥 VIJEST DANA</div>
      <div class="hero-body">
        <div class="hero-cat">${hero.cat}</div>
        <div class="hero-title">${hero.title}</div>
        <button class="hero-btn" onclick="window.open('${hero.link}','_blank')">PROČITAJ →</button>
      </div>
    </div>
  `;
}

function renderNews() {
  document.getElementById("newsGrid").innerHTML = wpPosts.slice(1,7).map(p => `
    <div class="news-card" onclick="window.open('${p.link}','_blank')">
      <img src="${p.img}" loading="lazy">
      <div class="news-overlay">
        <div class="news-cat">${p.cat}</div>
        <div class="news-title">${p.title}</div>
        <div class="news-date">📅 ${p.date}</div>
      </div>
    </div>
  `).join('');
}

function renderTicker() {
  const items = wpPosts.slice(0,5).map(p => `<span class="t-item">⚡ ${p.title.substring(0,60)}</span>`);
  document.getElementById("tickerInner").innerHTML = [...items, ...items].join('');
}

// TRANSFERI SA VELIKIM FOTOGRAFIJAMA
function renderTransfers() {
  document.getElementById("trWidgetHome").innerHTML = `
    <div class="tr-item" onclick="go('transferi')">
      <div class="tr-av"><img src="https://www.rolaj-me.com/wp-content/uploads/2026/05/imageedit_1_7422185843.jpg"></div>
      <div class="tr-info"><div class="tr-name">Adrijan Rudović</div><div class="tr-detail">Stoper · 30g · Slobodan igrač</div></div>
      <span class="tr-badge free">SLOBODAN</span>
    </div>
    <div class="tr-item" onclick="go('transferi')">
      <div class="tr-av">VS</div>
      <div class="tr-info"><div class="tr-name">Vesko Stešević</div><div class="tr-detail">Trener · FK Mornar Bar</div></div>
      <span class="tr-badge contract">PRODUŽIO</span>
    </div>
    <div class="tr-item" onclick="go('transferi')">
      <div class="tr-av">GP</div>
      <div class="tr-info"><div class="tr-name">Gojko Petović</div><div class="tr-detail">Arsenal Tivat → Češka 1. liga?</div></div>
      <span class="tr-badge rumour">🔥 GLASINA</span>
    </div>
    <div class="tr-item" onclick="go('transferi')">
      <div class="tr-av">NK</div>
      <div class="tr-info"><div class="tr-name">Neđeljko Kovinić</div><div class="tr-detail">Arsenal Tivat → Češka 1. liga?</div></div>
      <span class="tr-badge rumour">🔥 GLASINA</span>
    </div>
  `;
}

// REZULTATI
function switchLeague(l) { curLg = l;
  document.querySelectorAll(".stab").forEach((s,i) => s.classList.toggle("on", i===l-1));
  document.getElementById("matchesContainer").innerHTML = matchesData[curLg].map(m => `
    <div class="mc"><div class="mc-status">Kraj</div><div class="mc-team"><span class="mc-name">${m.t1}</span><span class="mc-sc">${m.s1}</span></div><div class="mc-team"><span class="mc-name">${m.t2}</span><span class="mc-sc">${m.s2}</span></div></div>
  `).join('');
  renderSidebar();
}

function renderSidebar() {
  const pm = {cl:"p1",eu:"p2",rl:"pr",n:"pn"};
  document.getElementById("tableBody").innerHTML = `<tr><th>#</th><th>Klub</th><th>Ut</th><th>Bod</th></tr>${tablesData[1].map(r => `<tr><td><div class="pm ${pm[r.z]}">${r.rank}</div></td><td>${r.name}</td><td>${r.ut}</td><td class="pts">${r.pts}</td></tr>`).join('')}`;
  document.getElementById("scorersBody").innerHTML = scorersData[1].map(s => `<div class="scorer"><div class="scr-rank ${s.top?'top':''}">${s.rank}</div><div>${s.name}<br><small>${s.club}</small></div><div class="scr-goals">${s.g}</div></div>`).join('');
  document.getElementById("koloBody").innerHTML = matchesData[1].map(m => `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px"><span>${m.t1}</span><span style="color:var(--gold)">${m.s1}-${m.s2}</span><span>${m.t2}</span></div>`).join('');
}

// NAVIGACIJA
function go(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(`page-${page}`).classList.add("active");
  document.querySelectorAll(".nav-links a").forEach(l => l.classList.remove("active"));
  document.getElementById(`nl-${page}`).classList.add("active");
  window.scrollTo({top:0});
}

// TEMA
let dark = true;
function toggleTheme() { dark = !dark; document.documentElement.setAttribute("data-theme", dark ? "dark" : "light"); document.querySelector(".btn-theme").textContent = dark ? "🌙" : "☀️"; }

// POKRENI
loadPosts();
renderTransfers();
switchLeague(1);
</script>

</body>
</html>
